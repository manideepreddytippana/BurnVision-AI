services:

  db:
    image: mysql:8.0
    container_name: burnvision-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: calorie_ai
    ports:
      - "3307:3306"      
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - burnvision-net

  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: burnvision-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      
      DATABASE_URL: mysql+pymysql://root:root@db:3306/calorie_ai
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-secret-key}
      JWT_ACCESS_TOKEN_EXPIRES: ${JWT_ACCESS_TOKEN_EXPIRES:-3600}
      JWT_REFRESH_TOKEN_EXPIRES: ${JWT_REFRESH_TOKEN_EXPIRES:-2592000}
      
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_AI_MODEL: ${SARVAM_AI_MODEL:-sarvam-m}
      SARVAM_AI_TIMEOUT: ${SARVAM_AI_TIMEOUT:-25}
      
      FLASK_APP: main.py
      FLASK_ENV: production
      FLASK_DEBUG: "0"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - burnvision-net

  
  user-frontend:
    build:
      context: ./user-frontend
      dockerfile: Dockerfile
    container_name: burnvision-user-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - burnvision-net

  
  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000
    container_name: burnvision-admin-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - burnvision-net


volumes:
  mysql_data:
    driver: local


networks:
  burnvision-net:
    driver: bridge
